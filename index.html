<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nos petits jeux 💗</title>
<style>
  :root{
    --rose:        #ffd9e4;
    --rose-clair:  #fff2f6;
    --rose-voile:  #fff7fa;
    --rose-fonce:  #ff6f9c;
    --rose-profond:#e8437a;
    --texte:       #7a3350;
    --gris:        #b9758f;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    color:var(--texte);
    background:
      radial-gradient(circle at 18% 8%,  #fff 0%, transparent 44%),
      radial-gradient(circle at 86% 92%, #ffe6ee 0%, transparent 48%),
      linear-gradient(160deg, var(--rose-clair) 0%, var(--rose) 100%);
    min-height:100vh;
    min-height:100dvh;
    -webkit-tap-highlight-color:transparent;
  }

  .motif{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'>\
<path d='M20 32c-6-5-11-9-11-15a7 7 0 0 1 12-5 7 7 0 0 1 12 5c0 6-5 10-11 15l-1 1z' fill='%23ff9dbd' opacity='0.22'/>\
<path d='M60 72c-6-5-11-9-11-15a7 7 0 0 1 12-5 7 7 0 0 1 12 5c0 6-5 10-11 15l-1 1z' fill='%23ffb3cc' opacity='0.18'/>\
</svg>");
    background-size:80px 80px;
  }

  .coeurs{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:1; }
  .coeur-flottant{
    position:absolute; bottom:-50px; opacity:0;
    animation:monte linear forwards; user-select:none;
  }
  @keyframes monte{
    0%{ transform:translateY(0) scale(.7); opacity:0; }
    15%{ opacity:.75; }
    100%{ transform:translateY(-105vh) rotate(var(--tourne)) scale(1.1); opacity:0; }
  }

  .page{
    position:relative; z-index:2;
    max-width:620px; margin:0 auto;
    padding:44px 16px 30px;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
  }

  /* ---------- en-tête ---------- */
  header{ text-align:center; margin-bottom:26px; }
  .surtitre{
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--rose-fonce); font-weight:700;
  }
  h1{
    font-size:clamp(28px,7vw,40px); font-weight:800; letter-spacing:-.02em;
    color:var(--rose-profond); margin:9px 0 8px;
  }
  .intro{ font-size:14px; color:var(--gris); font-style:italic; }

  /* ---------- la liste des jeux, en deux colonnes ---------- */
  .jeux{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }

  .jeu{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:7px;
    padding:22px 14px 18px;
    border-radius:22px;
    background:rgba(255,255,255,.82);
    border:1px solid #ffd0e0;
    text-decoration:none; color:inherit;
    box-shadow:0 14px 32px -22px rgba(232,67,122,.75);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .jeu:hover{
    transform:translateY(-4px);
    background:#fff;
    box-shadow:0 22px 40px -20px rgba(232,67,122,.7);
  }
  .jeu:active{ transform:translateY(-1px); }

  .jeu .icone{
    font-size:38px; line-height:1;
    filter:drop-shadow(0 6px 12px rgba(232,67,122,.28));
  }
  .jeu .titre{
    font-size:15px; font-weight:800; color:var(--rose-profond);
    line-height:1.25;
  }
  .jeu .desc{
    font-size:12px; color:var(--gris); line-height:1.45;
  }
  .jeu .rythme{
    margin-top:3px;
    font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--rose-fonce);
    background:var(--rose-clair);
    padding:4px 10px; border-radius:999px;
  }

  /* ---------- le cœur secret ---------- */
  .secret{
    margin-top:auto; padding-top:36px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  #coeur-secret{
    background:none; border:none; cursor:pointer; padding:6px;
    font-size:20px; line-height:1;
    opacity:.4;
    transition:opacity .2s ease, transform .2s ease;
    filter:grayscale(.3);
  }
  #coeur-secret:hover{ opacity:.85; }
  #coeur-secret.bat{ animation:battement .5s ease; }
  @keyframes battement{
    0%,100%{ transform:scale(var(--taille,1)); }
    30%    { transform:scale(calc(var(--taille,1) * 1.5)); }
    60%    { transform:scale(calc(var(--taille,1) * 1.15)); }
  }
  .murmure{
    font-size:11.5px; color:var(--gris); font-style:italic;
    min-height:16px; opacity:0; transition:opacity .3s ease;
  }
  .murmure.vu{ opacity:.85; }

  @media (max-width:380px){
    .jeu{ padding:18px 10px 15px; border-radius:18px; }
    .jeu .icone{ font-size:32px; }
    .jeu .titre{ font-size:14px; }
    .jeu .desc{ font-size:11.5px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>

<div class="motif"></div>
<div class="coeurs" id="coeurs"></div>

<div class="page">
  <header>
    <div class="surtitre">Rien que pour toi</div>
    <h1>Nos petits jeux 💗</h1>
    <p class="intro">Choisis ce dont tu as envie aujourd'hui.</p>
  </header>

  <div class="jeux" id="jeux"></div>

  <div class="secret">
    <button type="button" id="coeur-secret" aria-label="Cœur">💗</button>
    <div class="murmure" id="murmure"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);

  /* =====================================================================
     Les jeux affichés sur l'accueil

     Ajouter une entrée dans ce tableau suffit à faire apparaître une carte
     supplémentaire : la grille se remplit toute seule, deux par ligne.
     ===================================================================== */
  const JEUX = [
    {
      icone:  "🌸",
      titre:  "Le mot du jour",
      desc:   "Un mot à deviner en six essais.",
      rythme: "Chaque jour",
      lien:   "jeu.html",
    },
    {
      icone:  "💞",
      titre:  "La grille de la semaine",
      desc:   "Des mots croisés sur un thème différent.",
      rythme: "Chaque lundi",
      lien:   "motscroises.html",
    },
  ];

  const zone = $("jeux");
  JEUX.forEach((jeu) => {
    const carte = document.createElement("a");
    carte.className = "jeu";
    carte.href = jeu.lien;

    const bloc = (classe, texte) => {
      const el = document.createElement("span");
      el.className = classe;
      el.textContent = texte;
      return el;
    };

    carte.appendChild(bloc("icone", jeu.icone));
    carte.appendChild(bloc("titre", jeu.titre));
    carte.appendChild(bloc("desc", jeu.desc));
    carte.appendChild(bloc("rythme", jeu.rythme));
    zone.appendChild(carte);
  });

  /* =====================================================================
     Le cœur secret

     Trois appuis ouvrent la page cachée. Le compteur évite qu'un appui
     involontaire suffise, et le cœur grossit à chaque fois pour signaler
     qu'il se passe quelque chose.
     ===================================================================== */
  const APPUIS_REQUIS = 3;
  const MURMURES = ["…", "encore un peu", "💗"];

  const coeur = $("coeur-secret");
  const murmure = $("murmure");
  let appuis = 0;

  coeur.addEventListener("click", () => {
    appuis += 1;

    const taille = 1 + appuis * 0.35;
    coeur.style.setProperty("--taille", taille);
    coeur.style.transform = "scale(" + taille + ")";
    coeur.style.opacity = Math.min(1, 0.4 + appuis * 0.25);
    coeur.style.filter = "grayscale(0)";

    // on relance l'animation même si la classe est déjà posée
    coeur.classList.remove("bat");
    void coeur.offsetWidth;
    coeur.classList.add("bat");

    murmure.textContent = MURMURES[Math.min(appuis - 1, MURMURES.length - 1)];
    murmure.classList.add("vu");

    if (appuis >= APPUIS_REQUIS) {
      for (let i = 0; i < 18; i++) setTimeout(unCoeur, i * 45);
      setTimeout(() => { location.href = "surprise.html"; }, 620);
    }
  });

  /* =====================================================================
     Décor
     ===================================================================== */
  const EMOJIS = ["💕", "💖", "💗", "💓", "❤️"];

  function unCoeur() {
    const c = document.createElement("span");
    c.className = "coeur-flottant";
    c.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    c.style.left = Math.random() * 100 + "%";
    c.style.fontSize = 14 + Math.random() * 18 + "px";
    c.style.animationDuration = 8 + Math.random() * 6 + "s";
    c.style.setProperty("--tourne", Math.random() * 100 - 50 + "deg");
    $("coeurs").appendChild(c);
    c.addEventListener("animationend", () => c.remove());
  }
  setInterval(unCoeur, 1900);
  for (let i = 0; i < 5; i++) setTimeout(unCoeur, i * 600);
})();
</script>
</body>
</html>
