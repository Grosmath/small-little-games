<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Est-ce que tu m'aimes ?</title>
<style>
  :root{
    --rose:        #ffd9e4;
    --rose-clair:  #fff2f6;
    --rose-fonce:  #ff6f9c;
    --rose-profond:#e8437a;
    --texte:       #7a3350;
    --blanc:       #ffffff;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color:var(--texte);
    background:
      radial-gradient(circle at 20% 15%, #fff 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #ffe6ee 0%, transparent 50%),
      linear-gradient(160deg, var(--rose-clair) 0%, var(--rose) 100%);
    min-height:100%;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- motif de coeurs en fond ---------- */
  .motif{
    position:fixed;
    inset:0;
    background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'>\
<path d='M20 32c-6-5-11-9-11-15a7 7 0 0 1 12-5 7 7 0 0 1 12 5c0 6-5 10-11 15l-1 1z' fill='%23ff9dbd' opacity='0.28'/>\
<path d='M60 72c-6-5-11-9-11-15a7 7 0 0 1 12-5 7 7 0 0 1 12 5c0 6-5 10-11 15l-1 1z' fill='%23ffb3cc' opacity='0.22'/>\
</svg>");
    background-size:80px 80px;
    pointer-events:none;
    animation:derive 34s linear infinite;
    z-index:0;
  }
  @keyframes derive{ to{ background-position:80px 160px; } }

  /* ---------- coeurs qui montent ---------- */
  .coeurs{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:1; }
  .coeur-flottant{
    position:absolute;
    bottom:-60px;
    font-size:22px;
    opacity:0;
    animation:monte linear forwards;
    user-select:none;
  }
  @keyframes monte{
    0%   { transform:translateY(0) rotate(0deg) scale(.7); opacity:0; }
    12%  { opacity:.85; }
    85%  { opacity:.6; }
    100% { transform:translateY(-105vh) rotate(var(--tourne)) scale(1.15); opacity:0; }
  }

  /* ---------- carte centrale ---------- */
  .scene{
    position:relative;
    z-index:2;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .carte{
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:34px;
    padding:52px 46px 46px;
    text-align:center;
    max-width:620px;
    width:100%;
    box-shadow:0 30px 70px -25px rgba(232,67,122,.45);
    animation:apparait .9s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes apparait{
    from{ opacity:0; transform:translateY(28px) scale(.94); }
    to  { opacity:1; transform:none; }
  }

  .grand-coeur{
    font-size:64px;
    line-height:1;
    display:inline-block;
    animation:battement 1.5s ease-in-out infinite;
    filter:drop-shadow(0 8px 16px rgba(232,67,122,.35));
  }
  @keyframes battement{
    0%,100%{ transform:scale(1); }
    14%    { transform:scale(1.18); }
    28%    { transform:scale(1); }
    42%    { transform:scale(1.12); }
    56%    { transform:scale(1); }
  }

  h1{
    margin:22px 0 10px;
    font-size:clamp(30px, 6.2vw, 50px);
    font-weight:800;
    letter-spacing:-.02em;
    color:var(--rose-profond);
    text-shadow:0 2px 0 rgba(255,255,255,.85);
  }

  .sous-titre{
    font-size:clamp(14px, 2.6vw, 17px);
    color:#a9647f;
    margin-bottom:38px;
    font-style:italic;
  }

  /* ---------- boutons ---------- */
  .boutons{
    display:flex;
    gap:20px;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    min-height:62px;
  }

  button{
    font-family:inherit;
    font-size:20px;
    font-weight:700;
    padding:17px 46px;
    border:none;
    border-radius:999px;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  }

  #oui{
    background:linear-gradient(135deg, var(--rose-fonce), var(--rose-profond));
    color:#fff;
    box-shadow:0 12px 26px -8px rgba(232,67,122,.75);
  }
  #oui:hover{ transform:translateY(-3px) scale(1.06); box-shadow:0 18px 34px -8px rgba(232,67,122,.85); }
  #oui:active{ transform:translateY(0) scale(.98); }

  #non{
    background:var(--blanc);
    color:#c47c96;
    border:2px solid #ffd0e0;
    box-shadow:0 8px 20px -10px rgba(122,51,80,.4);
    z-index:50;
    white-space:nowrap;   /* le bouton s'ajuste à son texte, sur une seule ligne */
  }
  /* état "en fuite" : sort du flux et se balade dans la fenêtre.
     Easing sans rebond : un cubic-bezier qui dépasse 1 ferait sortir
     le bouton de la fenêtre le temps de l'animation. */
  #non.fuit{
    position:fixed;
    margin:0;
    width:auto;
    transition:left .22s cubic-bezier(.22,1,.36,1),
               top  .22s cubic-bezier(.22,1,.36,1),
               transform .22s ease-out;
  }

  /* ---------- écran final ---------- */
  .final{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:28px;
    background:
      radial-gradient(circle at 50% 40%, rgba(255,255,255,.96), rgba(255,214,228,.97));
  }
  .final.visible{ display:flex; animation:fondu .6s ease both; }
  @keyframes fondu{ from{ opacity:0; } to{ opacity:1; } }

  .final .grand-coeur{ font-size:96px; }
  .final h2{
    font-size:clamp(30px, 7vw, 56px);
    color:var(--rose-profond);
    margin:24px 0 14px;
    font-weight:800;
  }

  /* accès au jeu du mot du jour */
  .lien-jeu{
    display:inline-block;
    margin-top:32px;
    padding:16px 34px;
    border-radius:999px;
    background:linear-gradient(135deg, var(--rose-fonce), var(--rose-profond));
    color:#fff;
    text-decoration:none;
    font-weight:800;
    font-size:17px;
    box-shadow:0 12px 26px -8px rgba(232,67,122,.75);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .lien-jeu:hover{
    transform:translateY(-3px) scale(1.04);
    box-shadow:0 18px 34px -8px rgba(232,67,122,.85);
  }

  /* barre de navigation, identique sur toutes les pages du site */
  .nav{ position:fixed; top:14px; left:14px; z-index:60; }
  .nav a{
    display:inline-block;
    padding:8px 15px;
    border-radius:999px;
    background:rgba(255,255,255,.85);
    border:1px solid #ffd0e0;
    color:#c47c96;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    box-shadow:0 6px 16px -10px rgba(232,67,122,.6);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  .nav a:hover{ background:#fff; color:var(--rose-profond); }
  .final p{ font-size:clamp(15px, 3vw, 20px); color:#a9647f; max-width:460px; line-height:1.65; }

  @media (max-width:520px){
    .carte{ padding:40px 24px 36px; border-radius:28px; }
    button{ font-size:18px; padding:15px 34px; }
    .boutons{ gap:14px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>

<div class="motif"></div>
<div class="coeurs" id="coeurs"></div>

<main class="scene">
  <section class="carte">
    <span class="grand-coeur">💗</span>
    <h1>Est-ce que tu m'aimes&nbsp;?</h1>
    <p class="sous-titre">Réponds honnêtement... prends ton temps 🌸</p>
    <div class="boutons" id="boutons">
      <button id="oui" type="button">Oui 💖</button>
      <button id="non" type="button">Non</button>
    </div>
  </section>
</main>

<div class="final" id="final">
  <span class="grand-coeur">💞</span>
  <h2>Je le savais&nbsp;!</h2>
  <p>Moi aussi je t'aime, très fort.<br>Merci d'être là, tous les jours. 🥰</p>
  <a class="lien-jeu" href="index.html">Retour aux jeux 🌸</a>
</div>

<nav class="nav"><a href="index.html">← Accueil</a></nav>

<script>
(function () {
  "use strict";

  const non      = document.getElementById("non");
  const oui      = document.getElementById("oui");
  const final    = document.getElementById("final");
  const conteneur= document.getElementById("coeurs");

  /* ---------------------------------------------------------
     Coeurs qui flottent en continu
  --------------------------------------------------------- */
  const EMOJIS = ["💕","💖","💗","💓","🩷","❤️","💘"];

  function laisserUnCoeur(x, y, taille) {
    const c = document.createElement("span");
    c.className = "coeur-flottant";
    c.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    c.style.left = (x !== undefined ? x : Math.random() * 100) + "%";
    c.style.fontSize = (taille || 16 + Math.random() * 26) + "px";
    c.style.animationDuration = (7 + Math.random() * 7) + "s";
    c.style.setProperty("--tourne", (Math.random() * 120 - 60) + "deg");
    if (y !== undefined) c.style.bottom = y + "px";
    conteneur.appendChild(c);
    c.addEventListener("animationend", () => c.remove());
  }

  for (let i = 0; i < 12; i++) {
    setTimeout(laisserUnCoeur, i * 380);
  }
  setInterval(laisserUnCoeur, 850);

  /* ---------------------------------------------------------
     Le bouton "Non" fuit la souris
  --------------------------------------------------------- */
  const DISTANCE_FUITE = 75;    // rayon de détection autour du bouton
  const BOND_MIN       = 50;    // amplitude minimale d'un saut
  const BOND_VARIATION = 70;    // aléatoire ajouté (saut = 50 à 120 px)
  const PREMIER_BOND   = 40;    // le tout premier saut reste discret
  const MARGE          = 16;    // marge minimale avec les bords
  let   fuites         = 0;
  let   dernierSaut    = 0;
  let   posX = 0, posY = 0;     // position de référence (boîte non transformée)

  const TAQUINERIES = [
    "Non", "Non ?", "T'es sûre ?", "Réfléchis bien...", "Vraiment ?",
    "Essaie encore 😏", "Raté !", "Jamais 😄", "Nope", "Trop lent 💨"
  ];

  function borner(v, min, max) {
    return max < min ? min : Math.max(min, Math.min(max, v));
  }

  /** Passe le bouton en position fixe, à l'endroit exact où il est. */
  function detacher() {
    if (non.classList.contains("fuit")) return;
    const r = non.getBoundingClientRect();   // pas encore de transform ici
    posX = r.left;
    posY = r.top;
    // pas de width/height figées : le bouton doit pouvoir grandir avec son texte
    non.style.left = posX + "px";
    non.style.top  = posY + "px";
    non.classList.add("fuit");
  }

  /** Déplace le bouton à l'opposé du curseur, en restant dans la fenêtre. */
  function fuir(sourisX, sourisY) {
    const maintenant = Date.now();
    if (maintenant - dernierSaut < 120) return;   // évite les sauts en rafale
    dernierSaut = maintenant;

    detacher();

    // dimensions de layout : insensibles au scale(), contrairement au rect visuel
    const w = non.offsetWidth;
    const h = non.offsetHeight;
    const maxX = window.innerWidth  - w - MARGE;
    const maxY = window.innerHeight - h - MARGE;

    // direction de fuite = vecteur souris -> centre du bouton
    let dx = posX + w / 2 - sourisX;
    let dy = posY + h / 2 - sourisY;
    const d = Math.hypot(dx, dy);
    if (d < 1) {                                  // souris pile au centre : angle au hasard
      const a = Math.random() * Math.PI * 2;
      dx = Math.cos(a); dy = Math.sin(a);
    }

    const angleFuite = Math.atan2(dy, dx);
    const bond = fuites === 0
      ? PREMIER_BOND + Math.random() * 30            // 40 à 70 px
      : BOND_MIN     + Math.random() * BOND_VARIATION;

    // On teste plusieurs directions autour de la fuite idéale et on garde
    // celle qui éloigne le plus du curseur une fois ramenée dans la fenêtre.
    // Chaque candidat étant déjà borné, le bouton ne peut jamais sortir.
    let meilleurX = posX, meilleurY = posY, meilleurScore = -Infinity;

    for (let i = 0; i < 12; i++) {
      const angle = angleFuite + (i / 12) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
      const x = borner(posX + Math.cos(angle) * bond, MARGE, maxX);
      const y = borner(posY + Math.sin(angle) * bond, MARGE, maxY);
      // on privilégie les premiers angles (droit à l'opposé du curseur)
      const score = Math.hypot(x + w / 2 - sourisX, y + h / 2 - sourisY) - i * 5;
      if (score > meilleurScore) {
        meilleurScore = score;
        meilleurX = x;
        meilleurY = y;
      }
    }

    posX = meilleurX;
    posY = meilleurY;
    non.style.left = posX + "px";
    non.style.top  = posY + "px";

    fuites++;
    non.textContent = TAQUINERIES[Math.min(fuites, TAQUINERIES.length - 1)];

    // le texte vient de changer : le bouton peut s'être élargi, on le
    // ramène dans la fenêtre avec ses nouvelles dimensions.
    posX = borner(posX, MARGE, window.innerWidth  - non.offsetWidth  - MARGE);
    posY = borner(posY, MARGE, window.innerHeight - non.offsetHeight - MARGE);
    non.style.left = posX + "px";
    non.style.top  = posY + "px";

    // il rapetisse au fil des tentatives (sans jamais devenir illisible)
    const echelle = Math.max(0.72, 1 - fuites * 0.035);
    non.style.transform = "scale(" + echelle + ")";

    // et le "Oui" devient de plus en plus tentant
    oui.style.transform = "scale(" + Math.min(1.35, 1 + fuites * 0.028) + ")";
  }

  /* --- souris : détection de proximité --- */
  document.addEventListener("mousemove", function (e) {
    const r = non.getBoundingClientRect();
    const px = Math.max(r.left, Math.min(e.clientX, r.right));
    const py = Math.max(r.top,  Math.min(e.clientY, r.bottom));
    if (Math.hypot(e.clientX - px, e.clientY - py) < DISTANCE_FUITE) {
      fuir(e.clientX, e.clientY);
    }
  }, { passive: true });

  /* --- clavier / focus : pas d'échappatoire non plus --- */
  non.addEventListener("focus", function () {
    const r = non.getBoundingClientRect();
    fuir(r.left + r.width / 2, r.top + r.height / 2);
    non.blur();
  });

  /* --- tactile : il s'échappe avant même le clic --- */
  ["touchstart", "pointerdown", "mouseenter"].forEach(function (evt) {
    non.addEventListener(evt, function (e) {
      const t = (e.touches && e.touches[0]) || e;
      fuir(t.clientX || 0, t.clientY || 0);
      e.preventDefault();
    }, { passive: false });
  });

  /* --- au cas où : un clic qui passerait quand même ne fait rien --- */
  non.addEventListener("click", function (e) {
    e.preventDefault();
    const r = non.getBoundingClientRect();
    fuir(r.left + r.width / 2, r.top + r.height / 2);
  });

  /* --- si la fenêtre est redimensionnée, on le garde visible --- */
  window.addEventListener("resize", function () {
    if (!non.classList.contains("fuit")) return;
    const maxX = window.innerWidth  - non.offsetWidth  - MARGE;
    const maxY = window.innerHeight - non.offsetHeight - MARGE;
    posX = borner(posX, MARGE, maxX);
    posY = borner(posY, MARGE, maxY);
    non.style.left = posX + "px";
    non.style.top  = posY + "px";
  });

  /* ---------------------------------------------------------
     "Oui" : explosion de coeurs + message final
  --------------------------------------------------------- */
  oui.addEventListener("click", function () {
    for (let i = 0; i < 60; i++) {
      setTimeout(function () {
        laisserUnCoeur(Math.random() * 100, Math.random() * 120, 20 + Math.random() * 34);
      }, i * 45);
    }
    setTimeout(function () {
      final.classList.add("visible");
      setInterval(function () { laisserUnCoeur(); }, 260);
    }, 480);
  });
})();
</script>
</body>
</html>
